version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/app/releases/backend
file_exists_behavior: OVERWRITE
hooks:
  AfterInstall:
    - location: deploy/after_install.sh
      timeout: 900
      runas: ubuntu
  ValidateService:
    - location: deploy/validate.sh
      timeout: 120
      runas: ubuntu
