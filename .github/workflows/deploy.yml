name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Docker build check
        if: github.event_name == 'pull_request'
        run: docker build -t ls-portal-api:ci .

  deploy:
    name: Build & deploy
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload deploy bundle
        run: |
          tar -czf bundle.tgz -C deploy .
          aws s3 cp bundle.tgz "s3://${ARTIFACT_BUCKET}/backend/${GITHUB_SHA}.tgz" --only-show-errors

      - name: Deploy to EC2 via SSM
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          PARAMS=$(jq -n \
            --arg bundle "s3://${ARTIFACT_BUCKET}/backend/${GITHUB_SHA}.tgz" \
            --arg image "$IMAGE" \
            --arg region "$AWS_REGION" \
            '{
              commands: [
                "set -euo pipefail",
                "mkdir -p /opt/ls-portal",
                "aws s3 cp \($bundle) /tmp/ls-portal-bundle.tgz --region \($region) --only-show-errors",
                "tar -xzf /tmp/ls-portal-bundle.tgz -C /opt/ls-portal",
                "rm -f /tmp/ls-portal-bundle.tgz",
                "chmod 700 /opt/ls-portal/deploy.sh",
                "/opt/ls-portal/deploy.sh \($image)"
              ],
              executionTimeout: ["900"]
            }')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ls-portal api ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          STATUS=Pending
          for _ in $(seq 1 180); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true

          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Smoke test
        if: vars.API_URL != ''
        run: |
          for i in $(seq 1 12); do
            curl -fsS "${{ vars.API_URL }}/health" && exit 0
            sleep 5
          done
          exit 1
